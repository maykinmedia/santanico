[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "santanico"
description = "Strip document metadata at scary speeds with Python and Rust."
authors = [
    {name = "Maykin Media", email = "support@maykinmedia.nl"}
]
license = { text = "MIT" }
license-files = ["LICENSE"]

keywords = ["rtf", "metadata", "sanitizer", "privacy", "streaming", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Text Processing :: Markup",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
requires-python = ">=3.11"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/maykinmedia/santanico"
"Bug Tracker" = "https://github.com/maykinmedia/santanico/issues"
"Source Code" = "https://github.com/maykinmedia/santanico"

[tool.maturin]
module-name = "santanico.santanico"
include = ["santanico/*.pyi", "santanico/py.typed"]

[dependency-groups]
dev = [
    "hypothesis>=6.113.0",
    "maturin>=1.15.0",
    "pyright>=1.1.414",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "pytest-memray>=1.11.0",
    "pytest>=8.3.5",
    "ruff>=0.16.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]
release = [
    "bump-my-version>=0.24.0",
]

# The `[package]` version in Cargo.toml is the single source of truth for
# the released wheel (maturin reads it via `dynamic = ["version"]` above).
# README.rst and docs/conf.py carry static copies, kept in sync by running
# bump-my-version (see [dependency-groups] `release`).
[tool.bumpversion]
current_version = "0.1.2"
# Commit the bump and create an annotated tag (pushed by `git push` with
# `push.followTags` set); pushing the tag triggers the Release workflow.
commit = true
message = ":bookmark: {new_version}"
commit_args = "--edit"
tag = true
tag_name = "{new_version}"
tag_message = "{new_version}"
files = [
    # Searches are anchored with lookbehinds so the match (and therefore the
    # replacement) is the version string itself only; in Cargo.toml and
    # Cargo.lock the anchor is the package name so the version of a
    # dependency can never match.
    {filename = "Cargo.toml", search = '(?<=name = "santanico"\nversion = ")[0-9]+\.[0-9]+\.[0-9]+', regex = true},
    {filename = "Cargo.lock", search = '(?<=name = "santanico"\nversion = ")[0-9]+\.[0-9]+\.[0-9]+', regex = true},
    {filename = "README.rst", search = '(?<=:Version: )[0-9]+\.[0-9]+\.[0-9]+', regex = true},
    {filename = "docs/conf.py", search = '(?<=release = ")[0-9]+\.[0-9]+\.[0-9]+', regex = true},
]

[tool.coverage.run]
branch = true
source = ["santanico"]

[tool.pyright]
include = ["santanico", "tests", "scripts"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmarks are expensive (20 MB payloads, multiple runs); they are skipped
# by default. Run them explicitly with `pytest --benchmark-enable` or
# `tox -e benchmark`.
addopts = "--benchmark-skip"

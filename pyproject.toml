[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "santanico"
description = "Strip document metadata at scary speeds with Python and Rust."
authors = [
    {name = "Maykin Media", email = "support@maykinmedia.nl"}
]
license = { text = "MIT" }
license-files = ["LICENSE"]

keywords = ["rtf", "metadata", "sanitizer", "privacy", "streaming", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Text Processing :: Markup",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
requires-python = ">=3.11"
dynamic = ["version"]

[tool.maturin]
module-name = "santanico.santanico"
include = ["santanico/*.pyi", "santanico/py.typed"]

[dependency-groups]
dev = [
    "hypothesis>=6.113.0",
    "maturin>=1.15.0",
    "pytest-benchmark>=4.0.0",
    "pytest-memray>=1.11.0",
    "pytest>=8.3.5",
    "ruff>=0.16.0",
]

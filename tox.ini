# All Python dependencies are maintained in the `dev`, `docs` and `release`
# dependency groups in pyproject.toml and installed from uv.lock via the
# tox-uv lock runner (`uv sync`). Do not add a `deps` section here.

[tox]
env_list =
    py311
    py312
    py313
    py314
    lint
    rust
    docs
    build
skip_missing_interpreters = true

# Map the CI python matrix (tox-gh-actions) onto the test envs.
[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
runner = uv-venv-lock-runner
package = wheel
dependency_groups = dev
# `pass_env` is on the base so every env that invokes the Rust toolchain
# (building the wheel, cargo clippy/test) reuses the host rustup setup.
# tox-uv does not pass these through by default, and the default `stable`
# toolchain may be too old for the crate's `edition` (e.g. 2024).
pass_env =
    RUSTUP_HOME
    CARGO_HOME
    RUSTUP_TOOLCHAIN
commands =
    pytest {posargs:tests} --cov --cov-report xml:reports/coverage-{envname}.xml
    # memray patches the allocator, run the memory test
    pytest -m limit_memory --memray

# --- Lint (Python) -----------------------------------------------------------
[testenv:lint]
package = skip
commands =
    ruff check --output-format=github {posargs:.}
    ruff format --check .

# --- Rust checks ---------------------------------------------------------------
[testenv:rust]
package = skip
allowlist_externals = cargo
commands =
    cargo clippy --all-targets -- -D warnings
    cargo test --all-targets

# --- Docs -----------------------------------------------------------------------
# `package = wheel` (inherited) installs the built extension so autodoc can
# import the real module. `linkcheck` is disabled until the PyPI project,
# Codecov and Read the Docs exist, since the badge targets 404 before then.
[testenv:docs]
dependency_groups = docs
changedir = docs
allowlist_externals = make
commands =
    make SPHINXOPTS="-W" html
#    make linkcheck

# --- Build: release wheel + sdist ----------------------------------------------
# Outputs to `dist/` (gitignored) so the artifacts are easy to inspect before
# publishing. Also run in CI as a build smoke test.
[testenv:build]
package = skip
commands =
    maturin build --release -o dist
    maturin sdist -o dist

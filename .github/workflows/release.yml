# Build and publish the release artifacts.
#
# Wheels are built on each target platform (a compiled extension cannot be
# cross-built on a single runner), collected as artifacts, attested, and
# published with `uv publish` using PyPI trusted publishing (OIDC, no token
# secret). Publishing only happens on tag push; `workflow_dispatch` builds
# and attests the artifacts without publishing, as a dry run.
#
# Target set is intentionally minimal: we have a pure-Python fallback for
# anything not covered. Extend on community request, not speculation.
name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # Pure-Python fallback wheel (py3-none-any): keeps `pip install` working on
  # platforms without a matching wheel and without a Rust toolchain to build
  # the sdist. Built with flit_core via scripts/build_pure_wheel.py (maturin
  # has no pure-wheel mode: it always compiles the pyo3 extension).
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install uv
        run: pip install uv
      - name: Build pure Python fallback wheel
        run: python scripts/build_pure_wheel.py
      - name: Upload pure wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-pure
          path: dist/santanico-*-py3-none-any.whl

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, macos, windows, sdist, pure]
    environment: release
    permissions:
      # Used for PyPI trusted publishing (OIDC token exchange)
      id-token: write
      # Used to download the build artifacts
      contents: read
      # Used to generate the artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF#refs/tags/}" = "$ver" ] || { echo "::error::tag '${GITHUB_REF#refs/tags/}' does not match version '$ver' in Cargo.toml"; exit 1; }
      - uses: actions/download-artifact@v7
      - name: Flatten artifacts
        run: mkdir dist && cp wheels-*/* dist/
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - name: Install uv
        if: startsWith(github.ref, 'refs/tags/')
        run: pip install uv
      - name: Publish to PyPI (trusted publishing)
        if: startsWith(github.ref, 'refs/tags/')
        run: uv publish --trusted-publishing always dist

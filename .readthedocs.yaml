# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Install only the docs dependencies (Sphinx + theme). The `santanico` package
# is deliberately NOT installed: autodoc imports it from source (see
# docs/conf.py) and it falls back to a pure-Python implementation, so the
# Rust extension does not need to be built.
python:
  install:
    - requirements: docs/requirements.txt
